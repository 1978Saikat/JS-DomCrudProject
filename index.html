<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"></meta>
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->

  <meta name="viewport" content="width=device-width, initial-scale=1"></meta>

  <title>JS DOM CRUD PROJECT</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></link>
</head>
    <body>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
            </ul>
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
              ADD
            </button>
          </div>
        </div>
      </nav>


      <main class="container">
        <table class="table" id="dataTable">
          <thead>
            <tr>
              <!-- <th scope="col">#</th> -->
              <th scope="col">First</th>
              <th scope="col">Last</th>
              <th scope="col">Email</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>


        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>

              <form id="dataForm">
                <div class="modal-body">
                  <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="firstName" class="form-control" id="firstName" placeholder="First Name" required>
                  </div>
                  <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="lastName" class="form-control" id="lastName" placeholder="Last Name" required>
                  </div>
                  <div class="mb-3">
                    <label for="emailId" class="form-label">Email address</label>
                    <input type="emailId" class="form-control" id="emailId" placeholder="name@example.com" required>
                  </input>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
              </form>

            </div>
          </div>
        </div>

      </main>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

      <script>
        // Define the storeDataLocalStorage and retrieveDataLocalStorage functions
        function storeDataLocalStorage(data) {
         localStorage.setItem('userData', JSON.stringify(data)); 
        }

        function retrieveDataLocalStorage() {
          const storedData = localStorage.getItem('userData');
          if (storedData) {
            return JSON.parse(storedData);
          }
          return null;
        }

        // Function to handle DOMContentLoaded event
        function initializeApp() {
          const form = document.getElementById('dataForm');
          const tableBody = document.querySelector('#dataTable tbody');
          
          form.addEventListener('submit', function(event) {
            event.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const emailId = document.getElementById('emailId').value;
            
            //  create new row
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${firstName}</td>
              <td>${lastName}</td>
              <td>${emailId}</td>
              <td>
                <button type="button" class="btn btn-primary">Edit</button>
                <button type="button" class="btn btn-danger">Delete</button>
              </td>
            `;

            // add row to table
            tableBody.appendChild(row);

            // store data in local storage
            const userData = retrieveDataLocalStorage() || [];
            userData.push({ firstName, lastName, emailId, buttons: [
              '<button type="button" class="btn btn-primary">Edit</button>',
              '<button type="button" class="btn btn-danger">Delete</button>'
            ]});
            storeDataLocalStorage(userData);

            // clear input
            form.reset();
          });

          // retrieve data from local storage
          const storedUserData = retrieveDataLocalStorage();
          if (storedUserData) {
            storedUserData.forEach((user) => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${user.firstName}</td>
                <td>${user.lastName}</td>
                <td>${user.emailId}</td>
                <td>
                  <button type="button" class="btn btn-primary">Edit</button>
                  <button type="button" class="btn btn-danger">Delete</button>
                </td>
                `;
                tableBody.appendChild(row);
            });
          }
        }

        // Call the initializeApp function after the DOM content has loaded
        document.addEventListener('DOMContentLoaded', initializeApp);
      </script>

    </div>
</html>
